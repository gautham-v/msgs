[package]
name = "msgs"
version = "0.4.1"
edition = "2024"
description = "A terminal client for iMessage on macOS"
repository = "https://github.com/gautham-v/msgs"
license = "MIT"
readme = "README.md"
keywords = ["imessage", "macos", "tui", "ratatui", "terminal"]
categories = ["command-line-utilities"]
# `cargo install --path .` and the release workflow both build this binary.
default-run = "msgs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.44"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0.0"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png"] }
libc = "0.2"
imessage-database = "4.2.0"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
plist = { version = "1.9.0", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }

# What `cargo install --path .` and the release workflow build. Whole-program
# optimization across one codegen unit, because a frame is drawn from a dozen
# small modules and the scroll arithmetic wants them inlined into each other;
# the debug info goes because nothing ships a symbolicated backtrace. Panics
# keep unwinding on purpose: the hook installed in `main` restores the terminal
# on the way out, so a crash lands on a usable screen rather than inside the
# alternate one.
# Dev builds skip debug info too — it was most of a multi-GB target/ and the
# TUI is debugged with logs, not a debugger. Set `debug = true` here if you
# ever need line numbers under lldb.
[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# The perf tests measure real work, so their dependencies are optimized even
# when the test binary itself is a debug build: an unoptimized SQLite and an
# unoptimized image decoder measure the compiler, not msgs.
[profile.test.package."*"]
opt-level = 2
